version: "3.9"

services:
  scylla:
    image: scylladb/scylla:5.4
    container_name: xclone-scylla
    command: --smp 1 --memory 1G --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - scylla-data:/var/lib/scylla

  backend:
    build: ./backend
    container_name: xclone-backend
    environment:
      SCYLLA_HOSTS: scylla
      SCYLLA_PORT: "9042"
      SCYLLA_KEYSPACE: xclone
    ports:
      - "3000:3000"
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./schema.cql:/app/schema.cql:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: xclone-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  scylla-data:
